name: Nix

# Builds the Nix package that other flakes consume as
# packages.<system>.default. Unlike the Standards gate, this runs on draft pull
# requests too, so a stale node_modules hash shows up while a change is still
# a draft. It is not a required check.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build pim
        run: nix build .#default -L

      - name: Check the binary and skills
        run: |
          result/bin/pim --help
          for skill in apps/cli/skills/*/SKILL.md; do
            cmp "$skill" "result/share/pim/skills/${skill#apps/cli/skills/}"
          done
