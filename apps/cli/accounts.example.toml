# Copy to ~/.config/pim/accounts.toml, then run: pim login
# Passwords and Microsoft sign-ins live in the OS keyring, not in this file.

[[accounts]]
email = "you@example.com"  # the address you pass to --account
name = "Your Name"         # sender name on drafts
host = "imap.example.com"  # IMAP server
# port = 993               # default 993
# secure = true            # implicit TLS; default true
# user = "you@example.com" # IMAP login; defaults to email
# auth = "password"        # "password" or "microsoft"; default "password"

# Calendars and contacts over CalDAV and CardDAV; leave out for mail only.
# [accounts.dav]
# url = "https://dav.example.com/" # the server's DAV root
# user = "you@example.com"         # DAV login; defaults to the IMAP user

# Outlook.com and Microsoft 365 accounts sign in with Microsoft instead.
# [[accounts]]
# email = "you@outlook.com"
# name = "Your Name"
# host = "outlook.office365.com"
# auth = "microsoft"
